name: Check for new Defuddle version

on:
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check-and-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check for a new defuddle version on npm
              id: check
              run: |
                  current=$(node -p "require('./package.json').dependencies.defuddle.replace(/^[^0-9]*/, '')")
                  latest=$(npm view defuddle version)
                  echo "current=$current"
                  echo "latest=$latest"
                  if [ "$current" != "$latest" ]; then
                    echo "update=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "update=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "latest=$latest" >> "$GITHUB_OUTPUT"

            - name: Bump defuddle dependency and plugin version
              if: steps.check.outputs.update == 'true'
              run: |
                  npm pkg set version="${{ steps.check.outputs.latest }}"
                  npm pkg set dependencies.defuddle="^${{ steps.check.outputs.latest }}"
                  npm install

            - name: Update manifest.json and versions.json
              if: steps.check.outputs.update == 'true'
              env:
                  npm_package_version: ${{ steps.check.outputs.latest }}
              run: node version-bump.mjs

            - name: Build plugin
              if: steps.check.outputs.update == 'true'
              run: npm run build

            - name: Commit and tag
              if: steps.check.outputs.update == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json manifest.json versions.json
                  git commit -m "chore: bump defuddle to ${{ steps.check.outputs.latest }}"
                  git tag "${{ steps.check.outputs.latest }}"
                  git push origin HEAD --tags

            - name: Check for optional styles
              if: steps.check.outputs.update == 'true'
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Create release
              if: steps.check.outputs.update == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${{ steps.check.outputs.latest }}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --notes="Automated release: bumps the bundled defuddle dependency to ${{ steps.check.outputs.latest }}." \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
